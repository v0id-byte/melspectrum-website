<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MelSpectrum · 融谱智能科技 — 让机器听懂声音</title>
<meta name="description" content="融谱智能科技 MelSpectrum：硬科技 × 声学智能。Piano Tuner ±0.1 音分；Somnil AUC 0.92。让机器听懂声音。" />
<style>
/* ============ Fonts ============ */
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-Italic.ttf') format('truetype');
  font-weight: 100 900;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Noto Sans SC';
  src: url('fonts/NotoSansSC.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

/* ============ Tokens ============ */
:root {
  --indigo: #6366F1;
  --indigo-deep: #4F46E5;
  --cyan: #22D3EE;
  --violet: #8B5CF6;
  --teal: #0D9488;
  --teal-bright: #14B8A6;

  --void: #030507;
  --surface: #0D1117;
  --surface-2: #151B24;
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.16);

  --fg: #FFFFFF;
  --fg-2: #C7CCD4;
  --fg-3: #8A93A0;
  --fg-4: #5B6473;

  --light-bg: #F5F5F7;
  --light-fg: #1D1D1F;
  --light-fg-2: #4A4D52;
  --light-line: rgba(0,0,0,0.08);

  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
  --sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 32px;

  --maxw: 1200px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--void);
  color: var(--fg);
  font-family: var(--sans);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-synthesis: none;
}
html { scroll-behavior: smooth; }
body { overflow-x: hidden; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* Selection */
::selection { background: rgba(99, 102, 241, 0.35); color: #fff; }

/* ============ Typography utilities ============ */
.t-display {
  font-weight: 800;
  font-size: clamp(48px, 8.2vw, 120px);
  line-height: 0.98;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
.t-h1 {
  font-weight: 700;
  font-size: clamp(40px, 5.6vw, 80px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.t-h2 {
  font-weight: 600;
  font-size: clamp(28px, 3.4vw, 48px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.t-h3 {
  font-weight: 600;
  font-size: clamp(22px, 2.2vw, 30px);
  line-height: 1.18;
  letter-spacing: -0.015em;
}
.t-eyebrow {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.t-body {
  font-size: 18px;
  line-height: 1.55;
  color: var(--fg-2);
  text-wrap: pretty;
}
.t-body-lg {
  font-size: 22px;
  line-height: 1.5;
  color: var(--fg-2);
  letter-spacing: -0.005em;
  text-wrap: pretty;
}
.t-mono { font-family: var(--mono); }

/* CN tightening */
:lang(zh), .cn {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  letter-spacing: 0;
}

/* ============ Layout ============ */
.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 48px);
}
.section {
  padding: clamp(80px, 12vh, 160px) 0;
  position: relative;
}
.section--tight { padding: clamp(60px, 8vh, 100px) 0; }
.section--light {
  background: var(--light-bg);
  color: var(--light-fg);
}
.section--light .t-body, .section--light .t-eyebrow { color: var(--light-fg-2); }

/* Divider */
.hairline {
  height: 1px;
  background: var(--line);
  width: 100%;
}

/* ============ Nav ============ */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 56px;
  display: flex;
  align-items: center;
  background: rgba(3, 5, 7, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
  transition: background 0.3s ease;
}
.nav__inner {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.nav__links {
  display: flex;
  gap: 28px;
  align-items: center;
}
.nav__link {
  font-size: 13px;
  color: var(--fg-2);
  font-weight: 400;
  transition: color 0.2s ease;
}
.nav__link:hover { color: var(--fg); }
.nav__cta {
  font-size: 13px;
  color: var(--fg);
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.nav__cta:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); }
@media (max-width: 720px) {
  .nav__links { display: none; }
}

/* Logo mark */
.logo-mark {
  width: 22px; height: 22px;
  display: inline-block;
  position: relative;
}

/* ============ Hero ============ */
.hero {
  min-height: 100vh;
  padding-top: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.hero__bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.hero__inner {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 80px 24px 0;
  max-width: 1100px;
}
.hero__badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid rgba(99, 102, 241, 0.4);
  border-radius: 999px;
  background: rgba(99, 102, 241, 0.06);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #A5B4FC;
  margin-bottom: 32px;
}
.hero__badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}
.hero__title {
  font-weight: 800;
  font-size: clamp(48px, 9vw, 132px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  margin: 0 0 28px;
}
.hero__title .grad {
  background: linear-gradient(180deg, #fff 0%, #fff 50%, #A5B4FC 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero__sub {
  font-size: clamp(18px, 2vw, 24px);
  line-height: 1.45;
  color: var(--fg-2);
  max-width: 720px;
  margin: 0 auto 44px;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.hero__cta {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 80px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 26px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.btn--primary {
  background: var(--fg);
  color: var(--void);
}
.btn--primary:hover {
  background: #E5E7EB;
  transform: translateY(-1px);
}
.btn--ghost {
  border-color: var(--line-strong);
  color: var(--fg);
  background: transparent;
}
.btn--ghost:hover {
  border-color: rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.04);
}
.btn--sm { padding: 9px 16px; font-size: 13px; }
.btn .arrow {
  display: inline-block;
  transition: transform 0.2s ease;
}
.btn:hover .arrow { transform: translateX(3px); }

/* Hero scroll indicator */
.hero__scroll {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg-4);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 2;
}
.hero__scroll .line {
  width: 1px;
  height: 36px;
  background: linear-gradient(180deg, transparent, var(--fg-3), transparent);
  background-size: 100% 200%;
  animation: scroll-cue 2.4s ease-in-out infinite;
}
@keyframes scroll-cue {
  0% { background-position: 0 -100%; }
  100% { background-position: 0 100%; }
}

/* ============ Value pillars ============ */
.pillars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.pillar {
  background: var(--void);
  padding: 56px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.pillar__num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--fg-4);
}
.pillar__metric {
  font-weight: 700;
  font-size: clamp(40px, 4.4vw, 64px);
  line-height: 1;
  letter-spacing: -0.04em;
  font-feature-settings: "tnum";
}
.pillar__metric .unit {
  font-size: 0.45em;
  font-weight: 500;
  color: var(--fg-3);
  margin-left: 6px;
  letter-spacing: -0.01em;
}
.pillar__title { font-size: 17px; font-weight: 600; }
.pillar__desc { font-size: 14px; color: var(--fg-3); line-height: 1.55; }
@media (max-width: 820px) {
  .pillars { grid-template-columns: 1fr; }
}

/* ============ Section heading (Apple-like big stage label) ============ */
.stage-head {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  margin-bottom: 64px;
}
.stage-head__row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.stage-head__eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.stage-head__sub {
  font-size: 17px;
  color: var(--fg-3);
  max-width: 420px;
  line-height: 1.5;
}

/* ============ Product showcase ============ */
.product {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  isolation: isolate;
}
.product__inner {
  position: relative;
  z-index: 2;
  padding: clamp(48px, 7vw, 96px);
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 48px;
  align-items: center;
}
.product__bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
@media (max-width: 920px) {
  .product__inner { grid-template-columns: 1fr; gap: 32px; }
}

.product--tuner {
  background: radial-gradient(120% 100% at 0% 0%, rgba(13, 148, 136, 0.18) 0%, rgba(13, 148, 136, 0.04) 40%, transparent 70%), #0A1614;
  border: 1px solid rgba(20, 184, 166, 0.18);
}
.product--somnil {
  background: radial-gradient(120% 100% at 100% 0%, rgba(139, 92, 246, 0.22) 0%, rgba(99, 102, 241, 0.10) 40%, transparent 70%), #0B0B14;
  border: 1px solid rgba(139, 92, 246, 0.22);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
}
.tag--teal {
  background: rgba(20, 184, 166, 0.12);
  border: 1px solid rgba(20, 184, 166, 0.35);
  color: #5EEAD4;
}
.tag--violet {
  background: rgba(139, 92, 246, 0.14);
  border: 1px solid rgba(139, 92, 246, 0.4);
  color: #C4B5FD;
}
.tag--cyan {
  background: rgba(34, 211, 238, 0.10);
  border: 1px solid rgba(34, 211, 238, 0.32);
  color: #67E8F9;
}

.product__name {
  font-weight: 700;
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1;
  letter-spacing: -0.035em;
  margin: 18px 0 14px;
}
.product__lead {
  font-size: 18px;
  line-height: 1.55;
  color: var(--fg-2);
  margin: 0 0 28px;
  max-width: 480px;
}
.specs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  border-top: 1px solid var(--line);
  padding-top: 24px;
  margin-bottom: 28px;
}
.spec__num {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  font-feature-settings: "tnum";
}
.spec__label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-4);
  margin-top: 4px;
}
.product__cta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.linkish {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--fg);
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: 2px;
  transition: border-color 0.2s ease;
}
.linkish:hover { border-color: var(--fg); }

/* Product visual area */
.product__visual {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--line);
}

/* ============ Tuner visual: railsback / piano ============ */
.tuner-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tuner-readout {
  position: absolute;
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg-3);
  text-transform: uppercase;
  z-index: 2;
}
.tuner-readout .live {
  display: flex; align-items: center; gap: 6px;
}
.tuner-readout .live .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--teal-bright);
  box-shadow: 0 0 6px var(--teal-bright);
  animation: pulse 1.6s ease-in-out infinite;
}
.tuner-meter {
  position: absolute;
  bottom: 18px; left: 18px; right: 18px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 2;
}
.tuner-meter__top {
  display: flex; justify-content: space-between;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--fg-4);
  text-transform: uppercase;
}
.tuner-meter__top .now {
  color: var(--teal-bright);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
}
.tuner-meter__bar {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.tuner-meter__bar::after {
  content: "";
  position: absolute;
  top: -2px; bottom: -2px; left: 50%;
  width: 1px;
  background: var(--fg-4);
}
.tuner-meter__needle {
  position: absolute;
  top: 0; bottom: 0;
  width: 3px;
  background: var(--teal-bright);
  box-shadow: 0 0 8px var(--teal-bright);
  border-radius: 2px;
  transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ============ Somnil visual: spectrogram + sleep stage ============ */
.somnil-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.somnil-readout {
  position: absolute;
  top: 18px; left: 18px; right: 18px;
  z-index: 2;
  display: flex; justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg-3);
  text-transform: uppercase;
}
.somnil-readout .stage {
  display: flex; align-items: center; gap: 6px;
  color: #C4B5FD;
}
.somnil-stages {
  position: absolute;
  bottom: 18px; left: 18px; right: 18px;
  z-index: 2;
}
.somnil-stages__bar {
  display: flex;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.somnil-stages__seg { height: 100%; }
.somnil-stages__labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--fg-4);
  text-transform: uppercase;
}

/* ============ Tech grid ============ */
.tech-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.tech {
  background: var(--surface);
  padding: 40px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 320px;
  position: relative;
  transition: background 0.3s ease;
}
.tech:hover { background: var(--surface-2); }
.tech__num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg-4);
}
.tech__title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.tech__desc {
  font-size: 14px;
  line-height: 1.55;
  color: var(--fg-3);
  flex: 1;
}
.tech__data {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--fg-2);
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.tech__data .slash { color: var(--fg-4); margin: 0 6px; }
.tech__icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
}
@media (max-width: 820px) {
  .tech-grid { grid-template-columns: 1fr; }
}

/* ============ Team ============ */
.team-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.team-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 36px;
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 28px;
  align-items: start;
  transition: border-color 0.3s ease, background 0.3s ease;
}
.team-card:hover { border-color: var(--line-strong); }
.team-avatar {
  width: 96px; height: 96px;
  border-radius: 50%;
  border: 1px dashed var(--fg-4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--fg-4);
  text-align: center;
  text-transform: uppercase;
  background: linear-gradient(135deg, rgba(99,102,241,0.06), rgba(139,92,246,0.04));
}
.team-card__role {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 6px;
}
.team-card__name {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.team-card__bio {
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg-2);
  margin-bottom: 18px;
}
.team-card__meta {
  display: flex; flex-wrap: wrap;
  gap: 8px 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.04em;
}
.team-card__meta a { color: var(--fg); border-bottom: 1px solid var(--line-strong); padding-bottom: 1px; }
.team-card__meta a:hover { border-color: var(--fg); }
@media (max-width: 820px) {
  .team-grid { grid-template-columns: 1fr; }
  .team-card { grid-template-columns: 80px 1fr; padding: 28px; }
  .team-avatar { width: 80px; height: 80px; }
}

/* ============ Contact ============ */
.contact-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: end;
}
.contact-mail {
  font-weight: 700;
  font-size: clamp(36px, 5vw, 64px);
  letter-spacing: -0.035em;
  line-height: 1;
  display: inline-block;
  border-bottom: 2px solid var(--line);
  padding-bottom: 12px;
  transition: border-color 0.3s ease;
}
.contact-mail:hover { border-color: var(--fg); }
.contact-types {
  display: flex; flex-direction: column;
  gap: 14px;
  font-size: 15px;
  color: var(--fg-2);
}
.contact-types__row {
  display: flex; align-items: baseline;
  gap: 16px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.contact-types__row:last-child { border-bottom: 1px solid var(--line); }
.contact-types__row .k {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  flex: 0 0 130px;
}
@media (max-width: 820px) {
  .contact-block { grid-template-columns: 1fr; gap: 32px; }
  .contact-types__row .k { flex: 0 0 100px; }
}

/* ============ Footer ============ */
.footer {
  border-top: 1px solid var(--line);
  padding: 44px 0 32px;
  font-size: 12px;
  color: var(--fg-4);
}
.footer__inner {
  display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  font-family: var(--mono);
  letter-spacing: 0.06em;
}
.footer__inner a:hover { color: var(--fg-2); }

/* ============ Reveal-on-scroll ============ */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .hero__badge .dot { animation: none; }
  .hero__scroll .line { animation: none; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============ Marquee data strip ============ */
.strip {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 18px 0;
  background: #04070A;
}
.strip__track {
  display: flex;
  gap: 56px;
  white-space: nowrap;
  animation: marquee 50s linear infinite;
  width: max-content;
}
.strip__item { display: inline-flex; align-items: center; gap: 12px; }
.strip__dot {
  width: 4px; height: 4px;
  background: var(--cyan);
  border-radius: 50%;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ============ Misc ============ */
.kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--fg-2);
}
